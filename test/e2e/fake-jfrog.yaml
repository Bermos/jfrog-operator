apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-jfrog
spec:
  selector:
    matchLabels:
      app: fake-jfrog
  template:
    metadata:
      labels:
        app: fake-jfrog
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: fake-jfrog
          image: fake-jfrog:e2e
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: fake-jfrog
spec:
  selector:
    app: fake-jfrog
  ports:
    - port: 8080
      targetPort: 8080
