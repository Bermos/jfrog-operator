apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: teams
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1alpha1
    kind: Team
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $team := $xr.spec.team }}
            {{- $type := $xr.spec.packageType }}
            {{- $prefix := printf "%s-%s" $team $type }}
            ---
            apiVersion: artifactory.jfrog.bermos.io/v1alpha1
            kind: Repository
            metadata:
              name: {{ $prefix }}-local
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: local
            spec:
              rclass: local
              packageType: {{ $type }}
              description: Artifacts published by {{ $team }}
              xrayIndex: true
            ---
            apiVersion: artifactory.jfrog.bermos.io/v1alpha1
            kind: Repository
            metadata:
              name: {{ $prefix }}-remote
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: remote
            spec:
              rclass: remote
              packageType: {{ $type }}
              url: {{ $xr.spec.upstreamURL }}
              xrayIndex: true
            ---
            apiVersion: artifactory.jfrog.bermos.io/v1alpha1
            kind: Repository
            metadata:
              name: {{ $prefix }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: virtual
            spec:
              rclass: virtual
              packageType: {{ $type }}
              repositories:
                - {{ $prefix }}-local
                - {{ $prefix }}-remote
              defaultDeploymentRepo: {{ $prefix }}-local
            ---
            apiVersion: platform.jfrog.bermos.io/v1alpha1
            kind: Group
            metadata:
              name: {{ $team }}-developers
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: group
            spec:
              description: Developers of {{ $team }}
            ---
            apiVersion: platform.jfrog.bermos.io/v1alpha1
            kind: PermissionTarget
            metadata:
              name: {{ $prefix }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: permissions
            spec:
              repo:
                repositories:
                  - {{ $prefix }}-local
                  - {{ $prefix }}-remote
                actions:
                  groups:
                    {{ $team }}-developers: [read, write, annotate]
            {{- if $xr.spec.xrayPolicies }}
            ---
            apiVersion: xray.jfrog.bermos.io/v1alpha1
            kind: Watch
            metadata:
              name: {{ $prefix }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: watch
            spec:
              description: Artifacts of {{ $team }}
              resources:
                - type: repository
                  name: {{ $prefix }}-local
                - type: repository
                  name: {{ $prefix }}-remote
              assignedPolicies:
              {{- range $xr.spec.xrayPolicies }}
                - name: {{ .name }}
                  type: {{ .type }}
              {{- end }}
            {{- end }}
            {{- with (index .observed.resources "virtual") }}
            ---
            apiVersion: platform.example.org/v1alpha1
            kind: Team
            status:
              url: {{ .resource.status.url }}
            {{- end }}
    # Marks composed resources ready from their Ready condition, so the Team
    # only becomes ready once everything exists in JFrog.
    - step: automatically-detect-ready-composed-resources
      functionRef:
        name: function-auto-ready
