# A namespaced composite resource (Crossplane v2) that onboards a team for one
# package type:
#   - a local repository for the team's own artifacts,
#   - a remote repository proxying a public registry,
#   - a virtual repository combining both,
#   - a group and a permission target granting it access,
#   - an Xray watch applying existing policies to the team's artifacts.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: teams.platform.example.org
spec:
  scope: Namespaced
  group: platform.example.org
  names:
    kind: Team
    plural: teams
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [team, packageType, upstreamURL]
              properties:
                team:
                  type: string
                  description: Team name, used as prefix of everything created in JFrog.
                  pattern: "^[a-z0-9][a-z0-9-]*$"
                packageType:
                  type: string
                  description: Artifactory package type, e.g. maven, npm, pypi.
                upstreamURL:
                  type: string
                  description: Public registry the remote repository proxies.
                xrayPolicies:
                  type: array
                  description: Existing Xray policies to apply to the team's artifacts.
                  items:
                    type: object
                    required: [name, type]
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum: [security, license, operational_risk]
            status:
              type: object
              properties:
                url:
                  type: string
                  description: URL of the virtual repository to resolve from and deploy to.
