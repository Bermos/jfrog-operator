---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: repositories.artifactory.jfrog.bermos.io
spec:
  group: artifactory.jfrog.bermos.io
  names:
    categories:
    - jfrog
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    shortNames:
    - repo
    - repos
    singular: repository
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.externalName
      name: Key
      type: string
    - jsonPath: .spec.rclass
      name: Class
      type: string
    - jsonPath: .spec.packageType
      name: Type
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Repository is an Artifactory repository of any class.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RepositorySpec is the desired configuration of an Artifactory repository.
              The typed fields cover what most repositories need. Anything else
              Artifactory accepts in its repository configuration JSON can be set in
              config, and typed fields win where both are set.
            properties:
              adoptExisting:
                description: |-
                  AdoptExisting allows the operator to take over a resource that already
                  exists in JFrog but was not created by this object. Without it the
                  operator refuses to touch pre-existing resources.
                type: boolean
              config:
                description: |-
                  Config holds additional repository configuration as accepted by the
                  Artifactory repository configuration API, e.g. {"handleSnapshots": false}.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              connectionRef:
                description: |-
                  ConnectionRef selects the JFrog Platform to manage this resource in.
                  Defaults to the ClusterConnection named "default".
                properties:
                  kind:
                    default: ClusterConnection
                    description: |-
                      Kind of the referenced connection. A namespaced Connection must live in
                      the same namespace as the referencing resource.
                    enum:
                    - Connection
                    - ClusterConnection
                    type: string
                  name:
                    default: default
                    description: Name of the referenced connection.
                    type: string
                type: object
              defaultDeploymentRepo:
                description: DefaultDeploymentRepo of a virtual repository.
                type: string
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy decides whether the resource is deleted in JFrog when
                  this object is deleted.
                enum:
                - Delete
                - Orphan
                type: string
              description:
                description: Description of the repository.
                type: string
              environments:
                description: Environments the repository belongs to, e.g. DEV or PROD.
                items:
                  type: string
                type: array
              excludesPattern:
                description: ExcludesPattern lists the artifact patterns to exclude,
                  comma separated.
                type: string
              includesPattern:
                description: IncludesPattern lists the artifact patterns to include,
                  comma separated.
                type: string
              key:
                description: Key of the repository in Artifactory. Defaults to metadata.name.
                maxLength: 64
                minLength: 1
                pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                type: string
              managementPolicy:
                default: Manage
                description: ManagementPolicy decides whether the operator may write
                  to JFrog.
                enum:
                - Manage
                - Observe
                type: string
              members:
                description: Members of a federated repository.
                items:
                  description: FederatedMember is a member of a federated repository.
                  properties:
                    enabled:
                      default: true
                      description: Enabled toggles the member.
                      type: boolean
                    url:
                      description: URL of the member repository, e.g. https://other.example.com/artifactory/my-repo.
                      type: string
                  required:
                  - url
                  type: object
                type: array
              notes:
                description: Notes are internal notes on the repository.
                type: string
              packageType:
                description: PackageType of the repository, e.g. maven, npm, docker,
                  helm, generic.
                minLength: 1
                type: string
              passwordSecretRef:
                description: PasswordSecretRef selects the password for the upstream
                  of remote repositories.
                properties:
                  key:
                    description: Key within the Secret.
                    minLength: 1
                    type: string
                  name:
                    description: Name of the Secret.
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              projectKey:
                description: ProjectKey assigns the repository to a JFrog project.
                type: string
              rclass:
                description: RClass is the repository class.
                enum:
                - local
                - remote
                - virtual
                - federated
                type: string
              repoLayoutRef:
                description: RepoLayoutRef is the name of the repository layout.
                type: string
              repositories:
                description: Repositories aggregated by a virtual repository, in resolution
                  order.
                items:
                  type: string
                type: array
              url:
                description: URL of the upstream for remote repositories.
                type: string
              username:
                description: Username for the upstream of remote repositories.
                type: string
              xrayIndex:
                description: XrayIndex enables indexing by Xray.
                type: boolean
            required:
            - packageType
            - rclass
            type: object
            x-kubernetes-validations:
            - message: key is immutable
              rule: has(self.key) == has(oldSelf.key) && (!has(self.key) || self.key
                == oldSelf.key)
            - message: rclass is immutable
              rule: self.rclass == oldSelf.rclass
            - message: packageType is immutable
              rule: self.packageType == oldSelf.packageType
            - message: url is required for remote repositories
              rule: self.rclass != 'remote' || has(self.url)
            - message: passwordSecretRef is only valid for remote repositories
              rule: '!has(self.passwordSecretRef) || self.rclass == ''remote'''
          status:
            description: RepositoryStatus is the observed state of a Repository.
            properties:
              conditions:
                description: Conditions of the resource. Ready and Synced are always
                  reported.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              externalName:
                description: |-
                  ExternalName is the identifier of the resource in JFrog once this object
                  has created or adopted it.
                type: string
              lastSyncTime:
                description: LastSyncTime is when the resource was last compared against
                  JFrog.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation last reconciled.
                format: int64
                type: integer
              secretHash:
                description: |-
                  SecretHash is a hash of the secret values last written to Artifactory,
                  used to detect rotated credentials.
                type: string
              url:
                description: URL under which the repository is served.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
