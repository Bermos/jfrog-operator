---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: connections.platform.jfrog.bermos.io
spec:
  group: platform.jfrog.bermos.io
  names:
    categories:
    - jfrog
    kind: Connection
    listKind: ConnectionList
    plural: connections
    singular: connection
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .status.artifactoryVersion
      name: Artifactory
      type: string
    - jsonPath: .status.xrayVersion
      name: Xray
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Connection holds the URL and credentials of a JFrog Platform. Resources in
          the same namespace can reference it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ConnectionSpec describes how to reach a self-hosted JFrog
              Platform.
            properties:
              accessURL:
                description: AccessURL overrides the Access base URL.
                pattern: ^https?://
                type: string
              artifactoryURL:
                description: ArtifactoryURL overrides the Artifactory base URL.
                pattern: ^https?://
                type: string
              credentials:
                description: Credentials used to authenticate against the platform.
                properties:
                  accessTokenKey:
                    default: accessToken
                    description: AccessTokenKey is the Secret key holding an access
                      token.
                    type: string
                  passwordKey:
                    default: password
                    description: PasswordKey is the Secret key holding the password
                      for basic auth.
                    type: string
                  secretRef:
                    description: SecretRef is the Secret holding the credentials.
                    properties:
                      name:
                        description: Name of the Secret.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace of the Secret. Required for a ClusterConnection.
                        type: string
                    required:
                    - name
                    type: object
                  usernameKey:
                    default: username
                    description: UsernameKey is the Secret key holding the username
                      for basic auth.
                    type: string
                required:
                - secretRef
                type: object
              tls:
                description: TLS settings for talking to the platform.
                properties:
                  caSecretRef:
                    description: |-
                      CASecretRef points to a Secret key holding PEM encoded CA certificates
                      to trust in addition to the system roots.
                    properties:
                      key:
                        default: ca.crt
                        description: Key within the Secret.
                        type: string
                      name:
                        description: Name of the Secret.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace of the Secret. Required for a ClusterConnection.
                        type: string
                    required:
                    - name
                    type: object
                  insecureSkipVerify:
                    description: InsecureSkipVerify disables certificate verification.
                      Do not use in production.
                    type: boolean
                type: object
              url:
                description: |-
                  URL is the base URL of the JFrog Platform, e.g. https://jfrog.example.com.
                  Product URLs default to <url>/artifactory, <url>/access and <url>/xray.
                pattern: ^https?://
                type: string
              xrayURL:
                description: XrayURL overrides the Xray base URL.
                pattern: ^https?://
                type: string
            required:
            - credentials
            - url
            type: object
          status:
            description: ConnectionStatus reports whether the platform is reachable.
            properties:
              artifactoryVersion:
                description: ArtifactoryVersion as reported by Artifactory.
                type: string
              conditions:
                description: Conditions of the connection. Ready is True when Artifactory
                  answered.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastCheckTime:
                description: LastCheckTime is when the connection was last checked.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation last reconciled.
                format: int64
                type: integer
              xrayVersion:
                description: XrayVersion as reported by Xray. Empty when Xray is not
                  reachable.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
