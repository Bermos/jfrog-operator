---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: policies.xray.jfrog.bermos.io
spec:
  group: xray.jfrog.bermos.io
  names:
    categories:
    - jfrog
    kind: Policy
    listKind: PolicyList
    plural: policies
    shortNames:
    - xpol
    singular: policy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.externalName
      name: Policy
      type: string
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Policy is an Xray security, license or operational risk policy.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PolicySpec is the desired state of an Xray policy.
            properties:
              adoptExisting:
                description: |-
                  AdoptExisting allows the operator to take over a resource that already
                  exists in JFrog but was not created by this object. Without it the
                  operator refuses to touch pre-existing resources.
                type: boolean
              connectionRef:
                description: |-
                  ConnectionRef selects the JFrog Platform to manage this resource in.
                  Defaults to the ClusterConnection named "default".
                properties:
                  kind:
                    default: ClusterConnection
                    description: |-
                      Kind of the referenced connection. A namespaced Connection must live in
                      the same namespace as the referencing resource.
                    enum:
                    - Connection
                    - ClusterConnection
                    type: string
                  name:
                    default: default
                    description: Name of the referenced connection.
                    type: string
                type: object
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy decides whether the resource is deleted in JFrog when
                  this object is deleted.
                enum:
                - Delete
                - Orphan
                type: string
              description:
                description: Description of the policy.
                type: string
              managementPolicy:
                default: Manage
                description: ManagementPolicy decides whether the operator may write
                  to JFrog.
                enum:
                - Manage
                - Observe
                type: string
              policyName:
                description: PolicyName in Xray. Defaults to metadata.name.
                minLength: 1
                type: string
              rules:
                description: Rules of the policy.
                items:
                  description: PolicyRule is a rule of an Xray policy. Rules are evaluated
                    by priority.
                  properties:
                    actions:
                      description: |-
                        Actions taken on a violation, with the field names of the Xray policies
                        API, e.g. {"fail_build": true, "block_download": {"active": true, "unscanned": false}}.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    criteria:
                      description: |-
                        Criteria select the violations the rule applies to, with the field
                        names of the Xray policies API, e.g. {"min_severity": "high"},
                        {"cvss_range": {"from": 7, "to": 10}} or {"banned_licenses": ["GPL-3.0"]}.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    name:
                      description: Name of the rule.
                      minLength: 1
                      type: string
                    priority:
                      description: Priority of the rule, 1 being the highest.
                      format: int32
                      minimum: 1
                      type: integer
                  required:
                  - criteria
                  - name
                  - priority
                  type: object
                minItems: 1
                type: array
              type:
                description: Type of the policy.
                enum:
                - security
                - license
                - operational_risk
                type: string
            required:
            - rules
            - type
            type: object
            x-kubernetes-validations:
            - message: policyName is immutable
              rule: has(self.policyName) == has(oldSelf.policyName) && (!has(self.policyName)
                || self.policyName == oldSelf.policyName)
            - message: type is immutable
              rule: self.type == oldSelf.type
          status:
            description: PolicyStatus is the observed state of a Policy.
            properties:
              conditions:
                description: Conditions of the resource. Ready and Synced are always
                  reported.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              externalName:
                description: |-
                  ExternalName is the identifier of the resource in JFrog once this object
                  has created or adopted it.
                type: string
              lastSyncTime:
                description: LastSyncTime is when the resource was last compared against
                  JFrog.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation last reconciled.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
