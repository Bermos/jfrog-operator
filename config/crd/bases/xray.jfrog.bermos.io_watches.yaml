---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: watches.xray.jfrog.bermos.io
spec:
  group: xray.jfrog.bermos.io
  names:
    categories:
    - jfrog
    kind: Watch
    listKind: WatchList
    plural: watches
    shortNames:
    - xwatch
    singular: watch
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.externalName
      name: Watch
      type: string
    - jsonPath: .spec.active
      name: Active
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Watch applies Xray policies to repositories, builds, projects
          or release bundles.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WatchSpec is the desired state of an Xray watch.
            properties:
              active:
                default: true
                description: Active enables the watch.
                type: boolean
              adoptExisting:
                description: |-
                  AdoptExisting allows the operator to take over a resource that already
                  exists in JFrog but was not created by this object. Without it the
                  operator refuses to touch pre-existing resources.
                type: boolean
              assignedPolicies:
                description: AssignedPolicies applied to the resources.
                items:
                  description: AssignedPolicy references an Xray policy by name.
                  properties:
                    name:
                      description: Name of the policy in Xray.
                      minLength: 1
                      type: string
                    type:
                      description: Type of the policy.
                      enum:
                      - security
                      - license
                      - operational_risk
                      type: string
                  required:
                  - name
                  - type
                  type: object
                minItems: 1
                type: array
              connectionRef:
                description: |-
                  ConnectionRef selects the JFrog Platform to manage this resource in.
                  Defaults to the ClusterConnection named "default".
                properties:
                  kind:
                    default: ClusterConnection
                    description: |-
                      Kind of the referenced connection. A namespaced Connection must live in
                      the same namespace as the referencing resource.
                    enum:
                    - Connection
                    - ClusterConnection
                    type: string
                  name:
                    default: default
                    description: Name of the referenced connection.
                    type: string
                type: object
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy decides whether the resource is deleted in JFrog when
                  this object is deleted.
                enum:
                - Delete
                - Orphan
                type: string
              description:
                description: Description of the watch.
                type: string
              managementPolicy:
                default: Manage
                description: ManagementPolicy decides whether the operator may write
                  to JFrog.
                enum:
                - Manage
                - Observe
                type: string
              resources:
                description: Resources the watch covers.
                items:
                  description: WatchResource is a resource an Xray watch covers.
                  properties:
                    binMgrId:
                      default: default
                      description: BinMgrID is the id of the Artifactory instance.
                      type: string
                    filters:
                      description: Filters narrow the artifacts the watch covers.
                      items:
                        description: WatchFilter narrows the artifacts of a watched
                          resource.
                        properties:
                          type:
                            description: Type of the filter, e.g. regex, path-regex,
                              package-type, mime-type or ant-patterns.
                            minLength: 1
                            type: string
                          value:
                            description: |-
                              Value of the filter. A string for most filter types, an object for
                              ant-patterns (e.g. {"IncludePatterns": ["**"], "ExcludePatterns": []}).
                            x-kubernetes-preserve-unknown-fields: true
                        required:
                        - type
                        - value
                        type: object
                      type: array
                    name:
                      description: Name of the repository, build, project or release
                        bundle.
                      type: string
                    type:
                      description: Type of the resource.
                      enum:
                      - repository
                      - all-repos
                      - build
                      - all-builds
                      - project
                      - all-projects
                      - releaseBundle
                      - all-releaseBundles
                      type: string
                  required:
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: name is required for this resource type
                    rule: '!(self.type in [''repository'', ''build'', ''project'',
                      ''releaseBundle'']) || has(self.name)'
                minItems: 1
                type: array
              watchName:
                description: WatchName in Xray. Defaults to metadata.name.
                minLength: 1
                type: string
              watchRecipients:
                description: WatchRecipients are email addresses notified about violations.
                items:
                  type: string
                type: array
            required:
            - assignedPolicies
            - resources
            type: object
            x-kubernetes-validations:
            - message: watchName is immutable
              rule: has(self.watchName) == has(oldSelf.watchName) && (!has(self.watchName)
                || self.watchName == oldSelf.watchName)
          status:
            description: WatchStatus is the observed state of a Watch.
            properties:
              conditions:
                description: Conditions of the resource. Ready and Synced are always
                  reported.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              externalName:
                description: |-
                  ExternalName is the identifier of the resource in JFrog once this object
                  has created or adopted it.
                type: string
              lastSyncTime:
                description: LastSyncTime is when the resource was last compared against
                  JFrog.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation last reconciled.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
