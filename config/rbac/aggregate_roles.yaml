# Lets namespace admins and editors manage JFrog resources in their
# namespaces, and viewers read them. Crossplane's own service account also
# needs these permissions to compose the resources; see examples/crossplane.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jfrog-editor
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.crossplane.io/aggregate-to-crossplane: "true"
rules:
  - apiGroups: ["artifactory.jfrog.bermos.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["platform.jfrog.bermos.io"]
    resources: ["connections"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jfrog-viewer
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: ["artifactory.jfrog.bermos.io", "platform.jfrog.bermos.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
